name: synk
description: "A Desktop App that lets you inspect and interact devices connected to your computer."
publish_to: "none"
version: 1.0.0+1
repository: https://github.com/FelixCpp/synk

environment:
  sdk: ^3.13.4
  flutter: ^3.47.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  freezed_annotation: ^3.1.0

  api_adb:
    path: ../api_adb/
  api_devicectl:
    path: ../api_devicectl/
  synk_ui:
    path: ../synk_ui/
  app_logger:
    path: ../app_logger/

  flutter_bloc: ^9.1.1
  macos_window_utils: ^1.9.0
  rxdart: ^0.28.0
  bloc_concurrency: ^0.3.0
  path: ^1.9.1
  file_selector: ^1.1.0
  intl: ^0.20.3
  async: ^2.13.1
  path_provider: ^2.1.6
  use_in_case: ^1.4.3
  dartz: ^0.10.1
  desktop_drop: ^0.8.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2

flutter:
  assets:
    - ./assets/bundled_files/
