syntax = "proto3";
option java_package = "de.synk.proto";
option java_multiple_files = true;

package device_agent;

message GetInfoRequest {}
message GetInfoResponse {
  string model = 1;
  string manufacturer = 2;
  string android_version = 3;
  int32 sdk_version = 4;
}

message CaptureScreenshotRequest {}
message CaptureScreenshotResponse { bytes png = 1; }

message LockRotationRequest { int32 rotation = 1; }
message LockRotationResponse {}

message RestoreRotationRequest {}
message RestoreRotationResponse {}

message AgentError { string message = 1; }

message AgentRequest {
  oneof payload {
    GetInfoRequest get_info = 1;
    CaptureScreenshotRequest capture_screenshot = 2;
    LockRotationRequest lock_rotation = 3;
    RestoreRotationRequest restore_rotation = 4;
  }
}

message AgentResponse {
  oneof payload {
    GetInfoResponse get_info = 1;
    CaptureScreenshotResponse capture_screenshot = 2;
    AgentError error = 3;
    LockRotationResponse lock_rotation = 4;
    RestoreRotationResponse restore_rotation = 5;
  }
}
