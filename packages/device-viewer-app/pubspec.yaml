name: device_viewer
description: "A Desktop App that lets you inspect and interact devices connected to your computer."
publish_to: "none"
version: 1.0.0+1
repository: https://github.com/FelixCpp/device-viewer

environment:
  sdk: ^3.13.4
  flutter: ^3.47.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  freezed_annotation: ^3.1.0

  api_adb:
    path: ../api_adb/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2

flutter:
  uses-material-design: true
