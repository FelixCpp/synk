name: Release macOS App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3 (without a leading "v")'
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/synk_app

    steps:
      - name: Validate version input
        # Runs before checkout, so packages/synk_app does not exist yet.
        working-directory: .
        run: |
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$version' must look like 1.2.3 (no leading 'v', no suffixes)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag does not already exist
        run: |
          tag="v${{ inputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${tag}$"; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Run tests
        run: flutter test

      - name: Bump pubspec version
        run: |
          version="${{ inputs.version }}"
          build_number="${{ github.run_number }}"
          sed -i '' -E "s/^version: .+$/version: ${version}+${build_number}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package DMG
        run: |
          tag="v${{ inputs.version }}"
          APP_PATH="build/macos/Build/Products/Release/synk.app"
          STAGING_DIR="$(mktemp -d)/dmg"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create \
            -volname "synk" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            "synk-macos-${tag}.dmg"

      - name: Commit version bump and create tag
        run: |
          tag="v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: release ${tag}"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${tag}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: synk-macos-v${{ inputs.version }}
          path: packages/synk_app/synk-macos-v${{ inputs.version }}.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: synk v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: packages/synk_app/synk-macos-v${{ inputs.version }}.dmg
