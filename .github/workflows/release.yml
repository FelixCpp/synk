name: Release macOS App

# Builds a macOS .dmg from packages/synk_app and attaches it to a GitHub Release
# whenever a tag matching "v*" (e.g. v1.0.0) is pushed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/synk_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Run tests
        run: flutter test

      - name: Build macOS release
        run: flutter build macos --release

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/synk.app"
          STAGING_DIR="$(mktemp -d)/dmg"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create \
            -volname "synk" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            synk-macos.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: synk-macos-${{ steps.version.outputs.version }}
          path: packages/synk_app/synk-macos.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/synk_app/synk-macos.dmg
          generate_release_notes: true
